[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudtone"
version = "0.1.0"
description = "Watch a cloud chamber with a Raspberry Pi camera and turn particle tracks into music (local or Sonos)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6",
]

[project.optional-dependencies]
# On Raspberry Pi OS, install OpenCV + Picamera2 from apt instead (see README):
#   sudo apt install python3-opencv python3-picamera2
cv = ["opencv-python-headless>=4.8"]
local = ["sounddevice>=0.4"]
sonos = ["soco>=0.30", "lameenc>=1.5"]
dev = ["pytest>=7", "opencv-python-headless>=4.8"]

[project.scripts]
cloudtone = "cloudtone.main:main"

[tool.setuptools]
packages = ["cloudtone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
